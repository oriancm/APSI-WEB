services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - apsi-web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - apsi-network

  apsi-web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      PHP_UPLOAD_MAX_FILESIZE: 100M
      PHP_POST_MAX_SIZE: 100M
      PHP_MAX_EXECUTION_TIME: 300
      PHP_MEMORY_LIMIT: 256M
    volumes:
      - apsi_images:/var/www/html/pic
      - apsi_logs:/var/log/nginx
    networks:
      - apsi-network

  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin-password-hash
    volumes:
      - apsi_db:/var/lib/mysql
      - ./bdd/apsi.sql:/docker-entrypoint-initdb.d/001-apsi.sql:ro
      - ./bdd/create-admin.sh:/docker-entrypoint-initdb.d/002-create-admin.sh:ro
      - ${ADMIN_PASSWORD_HASH_FILE}:/run/secrets/admin-password-hash:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - apsi-network

volumes:
  apsi_images:
  apsi_logs:
  apsi_db:
  caddy_data:
  caddy_config:

networks:
  apsi-network:
    driver: bridge
